# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
        # Golden minhex output: each row ends with a space, which the tests compare byte for byte.
        exclude: ^test/config_files/minhex/.*\.minhex$
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-xml
    -   id: check-added-large-files
        args: ['--maxkb=10000']
    -   id: mixed-line-ending
    -   id: check-docstring-first
    -   id: double-quote-string-fixer
    -   id: debug-statements
    -   id: name-tests-test
        args: ['--pytest-test-first']
    -   id: pretty-format-json
        args: ['--autofix', '--no-sort-keys']
    -   id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        exclude: ^test/config_files/minhex/.*\.minhex$
-   repo: local
    hooks:
    # Compile with the oldest supported Python: flake8 runs on the developer's newer Python, and
    # pyupgrade skips a file it can't parse, so neither reports syntax that 3.11 rejects.
    -   id: python-311-syntax
        name: python 3.11 syntax
        entry: python scripts/check_python_syntax.py
        language: python
        language_version: python3.11
        types: [python]
-   repo: https://github.com/pycqa/flake8
    rev: '7.3.0'
    hooks:
    -   id: flake8
        args: [--max-line-length=127]
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py311-plus]
        language_version: python3.11
        exclude: ^src/bespokeasm/configgen/sublime/resources/bespokeasm_hover\.py$
-   repo: https://github.com/asottile/reorder-python-imports
    rev: v3.16.0
    hooks:
    -   id: reorder-python-imports
        args: [--py311-plus]
