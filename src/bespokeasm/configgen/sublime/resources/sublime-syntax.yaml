%YAML 1.2
---
file_extensions:
  - ##FILEEXTENSION##
scope: source.bespokeasm.##FILEEXTENSION##
version: 2

contexts:
  main:
    - include: counter_coordinates
    - include: directives
    - include: instructions
    - include: numbers
    - include: strings
    - include: operand_label_definitions
    - include: compiler_labels
    - match: ^\s*(##CONSTANT_PATTERN##)(?:\s*)?(\=|EQU)
      captures:
        1: variable.other.constant variable.other.constant.definition
        2: keyword.operator.assignment
    - match: ^\s*(##GLOBAL_SYMBOL_PATTERN##)\s*(\:)
      captures:
        1: variable.other.label.global variable.other.label.definition
        2: punctuation.definition.variable.colon.label
    - match: ^\s*(##LOCAL_SYMBOL_PATTERN##)\s*(\:)
      captures:
        1: variable.other.label.local variable.other.label.definition
        2: punctuation.definition.variable.colon.label
    - match: ^\s*(##FILE_SYMBOL_PATTERN##)\s*(\:)
      captures:
        1: variable.other.label.file variable.other.label.definition
        2: punctuation.definition.variable.colon.label
    - match: \;
      scope: punctuation.definition.comment
      push: line_comment
    - include: numerical_expressions

  counter_coordinates:
    - match: ^\s*(##SYMBOL_PATTERN##)\s*(:=)
      captures:
        1: variable.other.flow.coordinate variable.other.flow.coordinate.definition
        2: keyword.operator.assignment

  flow_counter_usages:
    - match: (?i)\b(COORDINATE|COUNTER)(\s*)(\()(\s*)(##SYMBOL_PATTERN##)
      captures:
        1: keyword.operator.flow
        3: punctuation.section.parens.begin
        5: variable.other.flow.counter variable.other.flow.counter.usage
      push:
        - meta_scope: expression.group
        - match: \)
          scope: punctuation.section.parens.end
          pop: true
        - include: numerical_expressions
        - match: \,
          scope: punctuation.separator
        - match: $
          pop: true

  flow_counter_directives:
    - match: (?i)\b(track)(\s+)(##SYMBOL_PATTERN##)
      captures:
        1: keyword.control.preprocessor
        3: variable.other.flow.counter
    - match: (?i)\b(as|mode)(\s*=\s*)(##SYMBOL_PATTERN##)
      captures:
        1: keyword.other.flow.parameter
        3: variable.other.flow.counter
    - match: (?i)\b(init|exit|min|max)(\s*=)
      captures:
        1: keyword.other.flow.parameter
    - match: (?i)\b(endtrack|entry|resume|set|suspend)(\s+)(##SYMBOL_PATTERN##)
      captures:
        1: keyword.control.preprocessor
        3: variable.other.flow.counter variable.other.flow.counter.usage

  flow_operators:
    - match: (?i)\b(?:COORDINATE|COUNTER)\b
      scope: keyword.operator.flow

  instructions:
    - match: (?i)(?:##INSTRUCTIONS##)
      scope: variable.function.instruction
      push:
        - meta_scope: meta.function
        - include: pop_instruction_end
        - include: strings
        - include: registers
        - include: operand_label_definitions
        - include: compiler_labels
        - include: indirect_addressing
        - include: deferred_addressing
        - include: numerical_expressions
        - include: operands_variables
        - match: \,
          scope: punctuation.separator
    - match: (?i)(?:##MACROS##)
      scope: variable.function.macro
      push:
        - meta_scope: meta.function
        - include: pop_instruction_end
        - include: strings
        - include: registers
        - include: operand_label_definitions
        - include: compiler_labels
        - include: indirect_addressing
        - include: deferred_addressing
        - include: numerical_expressions
        - include: operands_variables
        - match: \,
          scope: punctuation.separator

  operands_variables:
    - match: (?<!\w)(##SYMBOL_PATTERN##)(?!\w)
      scope: variable.parameter.instruction

  registers:
    - match: (?i)(?:##REGISTERS##)
      scope: variable.language.register

  compiler_labels:
    - match: (?<!\w)(?:##COMPILERCONSTANTS##)\b
      scope: constant.language

  operand_label_definitions:
    - match: (@)(##LABEL_PATTERN##)(:)(\s*)
      captures:
        1: punctuation.definition.variable.at.operand-label
        2: variable.other.label.definition variable.other.label.definition.operand-label
        3: punctuation.definition.variable.colon.operand-label

  strings:
    - match: "(\"|')"
      scope: punctuation.definition.string.begin
      push:
        - meta_scope: string.quoted
        - match: \\(?:[\\\'\"abfnrtv]|o[0-8]{2}|x[\da-fA-F]{2})
          scope: constant.character.escape
        - match: \1
          scope: punctuation.definition.string.end
          pop: true

  numbers:
    - match: (?<!\w)(?:\$[0-9a-fA-F]+|0x[0-9a-fA-F]+|[0-9a-fA-F]+H)\b
      scope: constant.numeric.integer.hexadecimal
    - match: (?<!\w)(?:(?:b|%)[01]+)\b
      scope: constant.numeric.integer.binary
    - match: (?<!\w)(?:\d+)\b
      scope: constant.numeric.integer.decimal
    - match: (?:\'.\')
      scope: constant.numeric.character

  comparison_operators:
    - match: (?:==|!=|>=|>|<=|<)
      scope: keyword.operator.logical

  numerical_expressions:
    - include: flow_counter_usages
    - include: flow_operators
    - include: numbers
    - include: registers
    - include: operand_label_definitions
    - include: compiler_labels
    - match: "[\\+\\-\\*\\/]{1}"
      scope: keyword.operator.arithmetic
    - match: "[\\&\\|\\^]{1}"
      scope: keyword.operator.logical
    - match: (?:>>|<<)
      scope: keyword.operator.bitwise
    - include: comparison_operators
    - match: \b(?:##EXPRESSION_FUNCTIONS##)\b
      scope: keyword.operator.word
    - include: operands_variables
    - match: \(
      scope: punctuation.section.parens.begin
      push:
        - meta_scope: expression.group
        - include: numerical_expressions
        - match: \)
          scope: punctuation.section.parens.end
          pop: true

  indirect_addressing:
    - match: (?<!\[)\[(?!\[)
      scope: punctuation.section.brackets.begin
      push:
        - meta_scope: expression.indirect_addressing
        - include: indirect_addressing
        - include: deferred_addressing
        - include: registers
        - include: operand_label_definitions
        - include: compiler_labels
        - include: numerical_expressions
        - include: operands_variables
        - match: \]
          scope: punctuation.section.brackets.end
          pop: true

  deferred_addressing:
    - match: (?<!\[)([\[]{2})\b
      scope: punctuation.section.double_brackets.begin
      push:
        - meta_scope: expression.deferred_addressing
        - include: indirect_addressing
        - include: deferred_addressing
        - include: registers
        - include: operand_label_definitions
        - include: compiler_labels
        - include: numerical_expressions
        - include: operands_variables
        - match: '[\]]{2}'
          scope: punctuation.section.double_brackets.end
          pop: true

  line_comment:
      - meta_scope: comment.line.semicolon
      - match: $
        pop: true

  compiler_directives:
    - match: (?<!\w)(?:##DIRECTIVES##)\b
      scope: keyword.other.directive
      push:
        - meta_scope: meta.directive
        - include: pop_instruction_end
        - include: strings
        - include: numerical_expressions
        - match: (?=(?:\s*\;|\s*$))
          pop: true

  data_types_directives:
    - match: (?<!\w)(?:##DATATYPES##)\b
      scope: storage.type
      push:
        - meta_scope: meta.directive
        - include: pop_instruction_end
        - include: strings
        - include: numerical_expressions
        - match: (?=(?:\s*\;|\s*$))
          pop: true

  preprocessor_directives:
    # Directives may be indented (e.g. nested #if blocks); the assembler
    # strips leading whitespace before recognizing them.
    - match: '^\s*(\#)'
      captures:
        1: punctuation.definition.preprocessor
      push:
        - meta_scope: meta.preprocessor
        - include: flow_counter_directives
        - match: (?<=\#)(?:##PREPROCESSOR##)\b
          scope: keyword.control.preprocessor
        - include: strings
        - include: numerical_expressions
        - match: (?=(?:\s*\;|\s*$))
          pop: true

  directives:
    - include: compiler_directives
    - include: data_types_directives
    - include: preprocessor_directives


  pop_instruction_end:
    - match: (?i)(?=(?:\s*\;|\s*$|##INSTRUCTIONS##))
      pop: true
      name: instructions
    - match: (?=^\s*(?:##SYMBOL_PATTERN##)\s*:)
      pop: true
      name: label
