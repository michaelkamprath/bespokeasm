# WDC W65C02S: the CMOS 65C02, with the Rockwell bit instructions (RMB, SMB, BBR, BBS)
# and WDC's WAI and STP. All 212 opcodes, byte-identical to ca65 2.18 with `.setcpu "65C02"`.
description: WDC W65C02S (65C02)
general:
  address_size: 16
  multi_word_endian: little
  registers:
    a:
      title: Accumulator
      description: The 8-bit accumulator. Written `a` for the accumulator addressing mode, as in `asl a`.
    x:
      title: X Index Register
      description: 8-bit index register, used by the `,x` and `(address,x)` addressing modes.
    y:
      title: Y Index Register
      description: 8-bit index register, used by the `,y` and `(address),y` addressing modes.
    # No operand names `s` or `p`, so source may use them as labels.
    s:
      title: Stack Pointer
      description: The low byte of the stack address; the stack occupies page one (`$0100`–`$01FF`) and grows downward.
      reserved: false
    p:
      title: Processor Status
      description: The status flags N, V, B, D, I, Z and C.
      reserved: false
  flags:
    N:
      description: 'Negative: bit 7 of the last result.'
    V:
      description: 'Overflow: signed overflow from `adc` or `sbc`, or bit 6 copied by `bit`.'
    B:
      description: 'Break: set in the status byte pushed by `brk` and `php`, clear when an interrupt pushes it.'
    D:
      description: 'Decimal mode: `adc` and `sbc` work in BCD when set.'
    I:
      description: 'Interrupt disable: IRQ is masked when set.'
    Z:
      description: 'Zero: set when the last result was zero.'
    C:
      description: 'Carry: carry out of, or borrow into, an add, subtract, compare or shift.'
  identifier:
    name: w65c02
    version: "1.0.0"
    extension: a65c
  min_version: '0.9.1a1'
  # As in ca65: `<` and `>` take the low and high byte of the term that follows,
  # and `*` is the address of the instruction.
  low_high_operators: tight
  current_address: instruction_start
  # ca65 names for data and fill directives.
  directive_aliases:
    word: 2byte
    addr: 2byte
    res: fill
    text: byte
  documentation:
    description: >-
      The WDC W65C02S, a CMOS 65C02: the 6502 instruction set plus `bra`, `phx`, `phy`, `plx`, `ply`,
      `stz`, `trb`, `tsb`, the bit instructions `rmb0`–`rmb7`, `smb0`–`smb7`, `bbr0`–`bbr7` and
      `bbs0`–`bbs7`, `wai` and `stp`, and the `(address)` and `jmp (address,x)` addressing modes.
      Little-endian, with 16-bit addresses.
    addressing_modes:
      implied:
        title: 'Implied'
        description: 'The instruction names everything it uses; there is no operand.'
      accumulator:
        title: 'Accumulator'
        description: 'Operates on the accumulator, written `a`. The operand may be left out, as in `asl`.'
      immediate:
        title: 'Immediate'
        description: 'An 8-bit value written after `#`, as in `lda #$10` or `lda #<message`.'
      zero_page:
        title: 'Zero Page'
        description: 'An address in page zero (`$0000`–`$00FF`), stored in one byte. Chosen automatically when the address is in zero page; otherwise the absolute form is used.'
      absolute:
        title: 'Absolute'
        description: 'A full 16-bit address, stored low byte first.'
      zero_page_x:
        title: 'Zero Page,X'
        description: 'A zero-page address plus X. The sum wraps within page zero.'
      absolute_x:
        title: 'Absolute,X'
        description: 'A 16-bit address plus X. Reads take one more cycle when the sum crosses a page.'
      zero_page_y:
        title: 'Zero Page,Y'
        description: 'A zero-page address plus Y. The sum wraps within page zero.'
      absolute_y:
        title: 'Absolute,Y'
        description: 'A 16-bit address plus Y. Reads take one more cycle when the sum crosses a page.'
      indexed_indirect:
        title: 'Indexed Indirect'
        description: 'X is added to a zero-page address, and the 16-bit pointer stored there is the effective address.'
      indirect_indexed:
        title: 'Indirect Indexed'
        description: 'The 16-bit pointer stored at a zero-page address, plus Y, is the effective address. Reads take one more cycle when adding Y crosses a page.'
      zero_page_indirect:
        title: 'Zero Page Indirect'
        description: 'The 16-bit pointer stored at a zero-page address is the effective address.'
      indirect:
        title: 'Indirect'
        description: 'The operand is the address of a 16-bit pointer, low byte first. Used only by `jmp`.'
      absolute_indexed_indirect:
        title: 'Absolute Indexed Indirect'
        description: 'X is added to a 16-bit address, and the pointer stored there is the jump target. Used only by `jmp`.'
      relative:
        title: 'Relative'
        description: 'A branch target within −128 to +127 bytes of the next instruction, stored as a signed offset from it. A taken branch takes one more cycle, or two if the target is on another page.'
      zero_page_relative:
        title: 'Zero Page, Relative'
        description: 'A zero-page address to test, then a branch target within −128 to +127 bytes of the next instruction. A taken branch takes one more cycle, or two if the target is on another page.'
    examples:
      - title: Zero page and absolute
        description: The same mnemonic uses the shorter zero-page form when the address is in page zero.
        code: |-
          counter = $10
          lda counter       ; zero page: A5 10
          sta $0200         ; absolute: 8D 00 02
      - title: Pointers
        description: The `(address),y` mode reads a 16-bit pointer from zero page.
        code: |-
          ptr = $20
          lda #<message
          sta ptr
          lda #>message
          sta ptr+1
          ldy #0
          lda (ptr),y
predefined:
  memory_zones:
    - name: ZERO_PAGE
      start: 0x0000
      end: 0x00FF
      documentation:
        title: Zero Page
        description: Page zero. Instructions use their shorter zero-page forms for addresses here.
    - name: STACK
      start: 0x0100
      end: 0x01FF
      documentation:
        title: Stack
        description: Page one, which holds the hardware stack.
# Flow counters (see the wiki's Flow Counters section): opt-in static analysis with `#track`.
# They don't change the assembled bytes.
flow_counters:
  stack:
    documentation:
      title: Hardware Stack Depth
      description: >-
        Bytes the tracked region has pushed on the page-one stack. Pushes add one and pulls
        subtract one; `jsr` and `rts` move the 2-byte return address, and an interrupt or `rti`
        the return address and status byte. S points at the next free byte, so
        `COORDINATE(stack, N)` names the byte at `$0100 + S + N` for N ≥ 1.
    min_value: 0
    max_value: 256
    default_init: 0
    exit_policy: balanced
    coordinate_offsets: positive
    allow_zero_offset: false
    unknown_instructions: error
    entry_modes:
      called:
        init: 0
        exit: 0
        description: >-
          A subroutine entered with `jsr`. The return address is at coordinates 1 and 2, so
          the counter must be back at 0 when `rts` runs.
      interrupt:
        init: 0
        exit: 0
        description: >-
          An interrupt handler. The status byte and return address are at coordinates 1 to 3,
          so the counter must be back at 0 when `rti` runs.
      jumped:
        init: 0
        description: >-
          Code entered by `jmp` or a branch, with no return address on the stack.
  cycles:
    source: documentation.cycles
    documentation:
      title: Clock Cycles
      description: >-
        Clock cycles, from each instruction's documented count. Extra cycles for crossing a
        page, and for `adc` and `sbc` in decimal mode, are not counted.
    min_value: 0
    default_init: 0
    exit_policy: none
    unknown_instructions: error
operand_sets:
  accumulator:
    operand_values:
      a:
        type: register
        register: a
        documentation:
          title: 'Accumulator'
          mode: accumulator
    documentation:
      title: 'Accumulator'
  immediate:
    operand_values:
      value:
        type: numeric
        prefix: '#'
        argument: {size: 8, word_align: true}
        documentation:
          title: 'Immediate'
          mode: immediate
    documentation:
      title: 'Immediate'
  zero_page:
    operand_values:
      address:
        type: address
        select_by_value: true
        argument: {size: 8, word_align: true, memory_zone: ZERO_PAGE}
        documentation:
          title: 'Zero Page'
          mode: zero_page
    documentation:
      title: 'Zero Page'
  zero_page_x:
    operand_values:
      address:
        type: address
        select_by_value: true
        argument: {size: 8, word_align: true, memory_zone: ZERO_PAGE}
        documentation:
          title: 'Zero Page,X'
          mode: zero_page_x
    documentation:
      title: 'Zero Page,X'
  zero_page_y:
    operand_values:
      address:
        type: address
        select_by_value: true
        argument: {size: 8, word_align: true, memory_zone: ZERO_PAGE}
        documentation:
          title: 'Zero Page,Y'
          mode: zero_page_y
    documentation:
      title: 'Zero Page,Y'
  absolute:
    operand_values:
      address:
        type: address
        argument: {size: 16, word_align: true}
        documentation:
          title: 'Absolute'
          mode: absolute
    documentation:
      title: 'Absolute'
  absolute_x:
    operand_values:
      address:
        type: address
        argument: {size: 16, word_align: true}
        documentation:
          title: 'Absolute,X'
          mode: absolute_x
    documentation:
      title: 'Absolute,X'
  absolute_y:
    operand_values:
      address:
        type: address
        argument: {size: 16, word_align: true}
        documentation:
          title: 'Absolute,Y'
          mode: absolute_y
    documentation:
      title: 'Absolute,Y'
  x_index:
    operand_values:
      x:
        type: register
        register: x
        documentation:
          title: 'X Index'
    documentation:
      title: 'X Index'
  y_index:
    operand_values:
      y:
        type: register
        register: y
        documentation:
          title: 'Y Index'
    documentation:
      title: 'Y Index'
  indirect_absolute:
    operand_values:
      pointer:
        type: indirect_numeric
        enclosure: parentheses
        argument: {size: 16, word_align: true}
        documentation:
          title: 'Indirect'
          mode: indirect
    documentation:
      title: 'Indirect'
  indexed_indirect:
    operand_values:
      pointer:
        type: indirect_indexed_numeric
        enclosure: parentheses
        argument: {size: 8, word_align: true}
        index_operands: {x: {type: register, register: x}}
        documentation:
          title: 'Indexed Indirect'
          mode: indexed_indirect
    documentation:
      title: 'Indexed Indirect'
  indirect_zero_page:
    operand_values:
      pointer:
        type: indirect_numeric
        enclosure: parentheses
        argument: {size: 8, word_align: true}
        documentation:
          title: 'Indirect Indexed'
          mode: indirect_indexed
    documentation:
      title: 'Indirect Indexed'
  relative:
    operand_values:
      target:
        type: relative_address
        offset_base: next_instruction
        argument: {size: 8, word_align: true, min: -128, max: 127}
        documentation:
          title: 'Relative'
          mode: relative
    documentation:
      title: 'Relative'
  zero_page_indirect:
    operand_values:
      pointer:
        type: indirect_numeric
        enclosure: parentheses
        argument: {size: 8, word_align: true}
        documentation:
          title: 'Zero Page Indirect'
          mode: zero_page_indirect
    documentation:
      title: 'Zero Page Indirect'
  absolute_indexed_indirect:
    operand_values:
      pointer:
        type: indirect_indexed_numeric
        enclosure: parentheses
        argument: {size: 16, word_align: true}
        index_operands: {x: {type: register, register: x}}
        documentation:
          title: 'Absolute Indexed Indirect'
          mode: absolute_indexed_indirect
    documentation:
      title: 'Absolute Indexed Indirect'
  zero_page_only:
    operand_values:
      address:
        type: address
        argument: {size: 8, word_align: true, memory_zone: ZERO_PAGE}
        documentation:
          title: 'Zero Page'
          mode: zero_page
    documentation:
      title: 'Zero Page'
instructions:
  # Load/Store
  lda:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Load Accumulator'
      description: 'Loads a byte from memory into A.'
      modifies:
        - register: a
          description: Loaded
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0xA9, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xA5, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xAD, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0xB5, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0xBD, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0xB9, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0xA1, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0xB1, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0xB2, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  ldx:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Load X Register'
      description: 'Loads a byte from memory into X.'
      modifies:
        - register: x
          description: Loaded
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0xA2, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xA6, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xAE, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0xB6, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_y, y_index]}}
        documentation: {title: 'Zero Page,Y', cycles: 4}
      - bytecode: {value: 0xBE, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
  ldy:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Load Y Register'
      description: 'Loads a byte from memory into Y.'
      modifies:
        - register: y
          description: Loaded
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0xA0, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xA4, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xAC, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0xB4, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0xBC, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
  sta:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Store Accumulator'
      description: 'Stores A in memory.'
    variants:
      - bytecode: {value: 0x85, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x8D, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x95, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x9D, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 5}
      - bytecode: {value: 0x99, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 5}
      - bytecode: {value: 0x81, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0x91, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 6}
      - bytecode: {value: 0x92, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  stx:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Store X Register'
      description: 'Stores X in memory.'
    variants:
      - bytecode: {value: 0x86, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x8E, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x96, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_y, y_index]}}
        documentation: {title: 'Zero Page,Y', cycles: 4}
  sty:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Store Y Register'
      description: 'Stores Y in memory.'
    variants:
      - bytecode: {value: 0x84, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x8C, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x94, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
  stz:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Load/Store'
      title: 'Store Zero'
      description: 'Stores zero in memory.'
    variants:
      - bytecode: {value: 0x64, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x9C, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x74, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x9E, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 5}
  # Register Transfer
  tax:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xAA, size: 8}
    documentation:
      category: 'Register Transfer'
      title: 'Transfer A to X'
      description: 'Copies A to X.'
      modifies:
        - register: x
          description: Set to A
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  tay:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xA8, size: 8}
    documentation:
      category: 'Register Transfer'
      title: 'Transfer A to Y'
      description: 'Copies A to Y.'
      modifies:
        - register: y
          description: Set to A
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  txa:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0x8A, size: 8}
    documentation:
      category: 'Register Transfer'
      title: 'Transfer X to A'
      description: 'Copies X to A.'
      modifies:
        - register: a
          description: Set to X
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  tya:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0x98, size: 8}
    documentation:
      category: 'Register Transfer'
      title: 'Transfer Y to A'
      description: 'Copies Y to A.'
      modifies:
        - register: a
          description: Set to Y
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  # Stack
  tsx:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xBA, size: 8}
    documentation:
      category: 'Stack'
      title: 'Transfer Stack Pointer to X'
      description: 'Copies the stack pointer S to X.'
      modifies:
        - register: x
          description: Set to S
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  txs:
    flow_invalidates: [stack]
    flow_transfer: none
    bytecode: {value: 0x9A, size: 8}
    documentation:
      category: 'Stack'
      title: 'Transfer X to Stack Pointer'
      description: 'Copies X to the stack pointer S.'
      modifies:
        - register: s
          description: Set to X
      cycles: 2
  pha:
    flow_effects: {stack: 1}
    flow_transfer: none
    bytecode: {value: 0x48, size: 8}
    documentation:
      category: 'Stack'
      title: 'Push Accumulator'
      description: 'Pushes A onto the stack.'
      cycles: 3
  php:
    flow_effects: {stack: 1}
    flow_transfer: none
    bytecode: {value: 0x08, size: 8}
    documentation:
      category: 'Stack'
      title: 'Push Processor Status'
      description: 'Pushes the status register P onto the stack, with B and bit 5 set in the pushed copy.'
      cycles: 3
  pla:
    flow_effects: {stack: -1}
    flow_transfer: none
    bytecode: {value: 0x68, size: 8}
    documentation:
      category: 'Stack'
      title: 'Pull Accumulator'
      description: 'Pulls a byte from the stack into A.'
      modifies:
        - register: a
          description: Pulled
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 4
  plp:
    flow_effects: {stack: -1}
    flow_transfer: none
    bytecode: {value: 0x28, size: 8}
    documentation:
      category: 'Stack'
      title: 'Pull Processor Status'
      description: 'Pulls the status register P from the stack. B and bit 5 are ignored.'
      modifies:
        - flag: N
          description: 'Pulled from the stack'
        - flag: V
          description: 'Pulled from the stack'
        - flag: D
          description: 'Pulled from the stack'
        - flag: I
          description: 'Pulled from the stack'
        - flag: Z
          description: 'Pulled from the stack'
        - flag: C
          description: 'Pulled from the stack'
      cycles: 4
  phx:
    flow_effects: {stack: 1}
    flow_transfer: none
    bytecode: {value: 0xDA, size: 8}
    documentation:
      category: 'Stack'
      title: 'Push X Register'
      description: 'Pushes X onto the stack.'
      cycles: 3
  phy:
    flow_effects: {stack: 1}
    flow_transfer: none
    bytecode: {value: 0x5A, size: 8}
    documentation:
      category: 'Stack'
      title: 'Push Y Register'
      description: 'Pushes Y onto the stack.'
      cycles: 3
  plx:
    flow_effects: {stack: -1}
    flow_transfer: none
    bytecode: {value: 0xFA, size: 8}
    documentation:
      category: 'Stack'
      title: 'Pull X Register'
      description: 'Pulls a byte from the stack into X.'
      modifies:
        - register: x
          description: Pulled
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 4
  ply:
    flow_effects: {stack: -1}
    flow_transfer: none
    bytecode: {value: 0x7A, size: 8}
    documentation:
      category: 'Stack'
      title: 'Pull Y Register'
      description: 'Pulls a byte from the stack into Y.'
      modifies:
        - register: y
          description: Pulled
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 4
  # Logical
  and:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Logical'
      title: 'Logical AND'
      description: 'A = A AND M.'
      modifies:
        - register: a
          description: Result
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0x29, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0x25, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x2D, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x35, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x3D, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0x39, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0x21, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0x31, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0x32, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  eor:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Logical'
      title: 'Exclusive OR'
      description: 'A = A XOR M.'
      modifies:
        - register: a
          description: Result
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0x49, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0x45, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x4D, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x55, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x5D, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0x59, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0x41, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0x51, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0x52, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  ora:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Logical'
      title: 'Logical Inclusive OR'
      description: 'A = A OR M.'
      modifies:
        - register: a
          description: Result
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0x09, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0x05, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x0D, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x15, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x1D, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0x19, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0x01, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0x11, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0x12, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  bit:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Logical'
      title: 'Bit Test'
      description: 'Tests A AND M without changing A. Z is set if the result is zero; N and V are copied from bits 7 and 6 of M. The immediate form affects only Z.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of M'
        - flag: V
          description: 'Set to bit 6 of M'
        - flag: Z
          description: 'Set if A AND M is zero'
    variants:
      - bytecode: {value: 0x89, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0x24, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x2C, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x34, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x3C, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
  # Arithmetic
  adc:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Arithmetic'
      title: 'Add with Carry'
      description: 'A = A + M + C. Clear C with `clc` before adding the low bytes. With D set, A and M are BCD. In decimal mode it takes one more cycle, and N, V and Z are valid.'
      modifies:
        - register: a
          description: Sum
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: V
          description: 'Set on signed overflow'
        - flag: Z
          description: 'Set if the result is zero'
        - flag: C
          description: 'Set on carry out of bit 7'
    variants:
      - bytecode: {value: 0x69, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0x65, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0x6D, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0x75, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0x7D, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0x79, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0x61, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0x71, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0x72, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  sbc:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Arithmetic'
      title: 'Subtract with Carry'
      description: 'A = A − M − (1 − C). Set C with `sec` before subtracting the low bytes. With D set, A and M are BCD. In decimal mode it takes one more cycle, and N, V and Z are valid.'
      modifies:
        - register: a
          description: Difference
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: V
          description: 'Set on signed overflow'
        - flag: Z
          description: 'Set if the result is zero'
        - flag: C
          description: 'Cleared on borrow, set otherwise'
    variants:
      - bytecode: {value: 0xE9, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xE5, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xED, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0xF5, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0xFD, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0xF9, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0xE1, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0xF1, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0xF2, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  cmp:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Arithmetic'
      title: 'Compare Accumulator'
      description: 'Compares A with M by computing A − M, without changing A.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of A − M'
        - flag: Z
          description: 'Set if A = M'
        - flag: C
          description: 'Set if A ≥ M (unsigned)'
    variants:
      - bytecode: {value: 0xC9, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xC5, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xCD, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
      - bytecode: {value: 0xD5, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 4}
      - bytecode: {value: 0xDD, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 4}
      - bytecode: {value: 0xD9, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_y, y_index]}}
        documentation: {title: 'Absolute,Y', cycles: 4}
      - bytecode: {value: 0xC1, size: 8}
        operands: {count: 1, operand_sets: {list: [indexed_indirect]}}
        documentation: {title: 'Indexed Indirect', cycles: 6}
      - bytecode: {value: 0xD1, size: 8}
        operands: {count: 2, operand_sets: {list: [indirect_zero_page, y_index]}}
        documentation: {title: 'Indirect Indexed', cycles: 5}
      - bytecode: {value: 0xD2, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page_indirect]}}
        documentation: {title: 'Zero Page Indirect', cycles: 5}
  cpx:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Arithmetic'
      title: 'Compare X Register'
      description: 'Compares X with M by computing X − M, without changing X.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of X − M'
        - flag: Z
          description: 'Set if X = M'
        - flag: C
          description: 'Set if X ≥ M (unsigned)'
    variants:
      - bytecode: {value: 0xE0, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xE4, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xEC, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
  cpy:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Arithmetic'
      title: 'Compare Y Register'
      description: 'Compares Y with M by computing Y − M, without changing Y.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of Y − M'
        - flag: Z
          description: 'Set if Y = M'
        - flag: C
          description: 'Set if Y ≥ M (unsigned)'
    variants:
      - bytecode: {value: 0xC0, size: 8}
        operands: {count: 1, operand_sets: {list: [immediate]}}
        documentation: {title: 'Immediate', cycles: 2}
      - bytecode: {value: 0xC4, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 3}
      - bytecode: {value: 0xCC, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 4}
  # Increment/Decrement
  inc:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Increment/Decrement'
      title: 'Increment Memory'
      description: 'Adds one to M. Also increments A, as `inc a` or `inc` alone.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0x1A, size: 8}
        documentation: {title: 'Accumulator (operand omitted)', cycles: 2}
      - bytecode: {value: 0x1A, size: 8}
        operands: {count: 1, operand_sets: {list: [accumulator]}}
        documentation: {title: 'Accumulator', cycles: 2}
      - bytecode: {value: 0xE6, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 5}
