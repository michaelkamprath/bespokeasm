        documentation: {title: 'Absolute,X', cycles: 7}
  inx:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xE8, size: 8}
    documentation:
      category: 'Increment/Decrement'
      title: 'Increment X Register'
      description: 'Adds one to X.'
      modifies:
        - register: x
          description: Incremented
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  iny:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xC8, size: 8}
    documentation:
      category: 'Increment/Decrement'
      title: 'Increment Y Register'
      description: 'Adds one to Y.'
      modifies:
        - register: y
          description: Incremented
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  dec:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Increment/Decrement'
      title: 'Decrement Memory'
      description: 'Subtracts one from M. Also decrements A, as `dec a` or `dec` alone.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
    variants:
      - bytecode: {value: 0x3A, size: 8}
        documentation: {title: 'Accumulator (operand omitted)', cycles: 2}
      - bytecode: {value: 0x3A, size: 8}
        operands: {count: 1, operand_sets: {list: [accumulator]}}
        documentation: {title: 'Accumulator', cycles: 2}
      - bytecode: {value: 0xC6, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 5}
      - bytecode: {value: 0xCE, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 6}
      - bytecode: {value: 0xD6, size: 8}
        operands: {count: 2, operand_sets: {list: [zero_page_x, x_index]}}
        documentation: {title: 'Zero Page,X', cycles: 6}
      - bytecode: {value: 0xDE, size: 8}
        operands: {count: 2, operand_sets: {list: [absolute_x, x_index]}}
        documentation: {title: 'Absolute,X', cycles: 7}
  dex:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0xCA, size: 8}
    documentation:
      category: 'Increment/Decrement'
      title: 'Decrement X Register'
      description: 'Subtracts one from X.'
      modifies:
        - register: x
          description: Decremented
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  dey:
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode: {value: 0x88, size: 8}
    documentation:
      category: 'Increment/Decrement'
      title: 'Decrement Y Register'
      description: 'Subtracts one from Y.'
      modifies:
        - register: y
          description: Decremented
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
      cycles: 2
  # Shift
  asl:
    flow_effects: {stack: 0}
    flow_transfer: none
    documentation:
      category: 'Shift'
      title: 'Arithmetic Shift Left'
      description: 'Shifts A or M left one bit. Bit 7 goes to C, and bit 0 becomes 0. The `address,x` form takes one more cycle when indexing crosses a page.'
      modifies:
        - flag: N
          description: 'Set to bit 7 of the result'
        - flag: Z
          description: 'Set if the result is zero'
        - flag: C
          description: 'Set to the old bit 7'
    variants:
      - bytecode: {value: 0x0A, size: 8}
        documentation: {title: 'Accumulator (operand omitted)', cycles: 2}
      - bytecode: {value: 0x0A, size: 8}
        operands: {count: 1, operand_sets: {list: [accumulator]}}
        documentation: {title: 'Accumulator', cycles: 2}
      - bytecode: {value: 0x06, size: 8}
        operands: {count: 1, operand_sets: {list: [zero_page]}}
        documentation: {title: 'Zero Page', cycles: 5}
      - bytecode: {value: 0x0E, size: 8}
        operands: {count: 1, operand_sets: {list: [absolute]}}
        documentation: {title: 'Absolute', cycles: 6}
      - bytecode: {value: 0x16, size: 8}
