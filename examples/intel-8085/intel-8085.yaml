description: Intel 8085
general:
  address_size: 16
  multi_word_endian: little
  registers:
    - a
    - b
    - c
    - d
    - e
    - h
    - l
    - m
    - bc
    - de
    - hl
    - sp
    - psw
  origin: 0
  identifier:
    name: intel-8085-asm
    version: "0.1.0"
    extension: a85
  min_version: "0.8.0"
# Flow counter classes available to assembly source (static analysis only;
# this section and the per-instruction flow metadata below are emission-inert
# and change no generated bytecode).
flow_counters:
  stack:
    documentation:
      title: Hardware Stack Depth
      description: >-
        Bytes of 8085 hardware stack depth owned by the tracked region. Every
        `push` deepens the stack by 2 bytes and every `pop` shallows it by 2;
        `call`/`ret` move the 2-byte return address. Coordinates use a 1-based
        convention: `COORDINATE(stack, 1)` names the byte the stack pointer
        physically addresses, so the byte at physical address `sp + N` is
        coordinate `N + 1`, and an `OFFSET()` value converts to a `dad sp`
        displacement by subtracting 1. `unknown_instructions` is `error`, so
        every ordinary instruction declares an explicit `stack: 0` effect and
        any instruction without one fails loudly inside a tracked region
        instead of being silently ignored. The class declares no `max_value`
        because the 8085 stack lives in general-purpose RAM with no
        architectural depth limit; a specific program's limit is a fact of its
        memory map, so bound it per region with the `#track stack ... max=`
        instance parameter, typically derived from the program's own
        memory-map symbols (for example
        `max=STACK_TOP - DATA_CEILING - 1` when both symbols are excluded
        boundary addresses).
    min_value: 0                 # depth can never go shallower than the region's anchor
    # no max_value: the 8085 stack lives in general-purpose RAM and has no
    # architectural depth limit -- each program declares its own memory-map
    # budget at the source level with `#track stack ... max=<expression>`
    # (see software/flow-stack-demo.a85)
    default_init: 0
    exit_policy: balanced
    coordinate_offsets: positive  # descending stack: live bytes are addressed as sp+N
    allow_zero_offset: false      # coordinate 1 is the byte at (SP); offset 0 names nothing
    unknown_instructions: error   # fail loud: no silently-untracked instructions
    entry_modes:
      called:
        init: 0
        exit: 0
        description: >-
          A subroutine entered via `call`. The counter tracks only stack
          movement the routine itself owns; the caller's 2-byte return address
          occupies coordinates 1-2 (physical addresses `sp+0`/`sp+1`), so
          `COORDINATE(stack, N)` with `N >= 3` addresses caller-pushed data
          above the return address. `ret` checks the counter is back at 0
          before its physical return-address pop.
      jumped:
        init: 0
        description: >-
          Code entered via `jmp` or fall-through (dispatcher targets,
          coroutines, tail-call destinations). No return address is on the
          stack and no `ret` terminal applies; close the region with a
          reachable `#endtrack` before transferring out.
      interrupt:
        init: 0
        exit: 0
        description: >-
          An interrupt service routine. The hardware-pushed return address is
          caller/control-flow state outside the routine-owned counter, so the
          ISR's own stack movement starts and ends balanced at 0.
operand_sets:
  8_bit_source:
    operand_values:
      b_reg:
        type: register
        register: b
        bytecode:
          value: 0
          size: 3
      c_reg:
        type: register
        register: c
        bytecode:
          value: 1
          size: 3
      d_reg:
        type: register
        register: d
        bytecode:
          value: 2
          size: 3
      e_reg:
        type: register
        register: e
        bytecode:
          value: 3
          size: 3
      h_reg:
        type: register
        register: h
        bytecode:
          value: 4
          size: 3
      l_reg:
        type: register
        register: l
        bytecode:
          value: 5
          size: 3
      m_reg:
        type: register
        register: m
        bytecode:
          value: 6
          size: 3
      m_reg_actual:
        type: indirect_register
        register: hl
        bytecode:
          value: 6
          size: 3
      a_reg:
        type: register
        register: a
        bytecode:
          value: 7
          size: 3
  register_pairs:
    operand_values:
      bc_pair_orig:
        type: register
        register: b
        bytecode:
          value: 0
          size: 2
      bc_pair:
        type: register
        register: bc
        bytecode:
          value: 0
          size: 2
      de_pair_orig:
        type: register
        register: d
        bytecode:
          value: 1
          size: 2
      de_pair:
        type: register
        register: de
        bytecode:
          value: 1
          size: 2
      hl_pair_orig:
        type: register
        register: h
        bytecode:
          value: 2
          size: 2
      hl_pair:
        type: register
        register: hl
        bytecode:
          value: 2
          size: 2
      sp_pair:
        type: register
        register: sp
        bytecode:
          value: 3
          size: 2
  register_pairs_bc_de_only:
    operand_values:
      bc_pair_orig:
        type: register
        register: b
        bytecode:
          value: 0
          size: 2
      bc_pair:
        type: register
        register: bc
        bytecode:
          value: 0
          size: 2
      de_pair_orig:
        type: register
        register: d
        bytecode:
          value: 1
          size: 2
      de_pair:
        type: register
        register: de
        bytecode:
          value: 1
          size: 2
  uint16_no_bytecode:
    operand_values:
      uint16:
        type: numeric
        argument:
          size: 16
          word_align: true
          endian: little
  uint8_no_bytecode:
    operand_values:
      uint16:
        type: numeric
        argument:
          size: 8
          word_align: true
instructions:
  # General
  nop:
    # no operation
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0
      size: 8
  hlt:
    # halt
    # analysis note: hlt stops the CPU until an interrupt/reset; execution then
    # resumes at the following instruction, so fall-through is the honest model
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x76
      size: 8
  stc:
    # set Carry flag
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x37
      size: 8
  cmc:
    # toggle carry flag (1's complement)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x3F
      size: 8
  out:
    # place A on data bus and indicated port on address bus
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xD3
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  in:
    # reads eight bits of data from the specified port and loads it into the accumulator.
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xDB
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode

  # Undocumented Instructions
  arhl:
    # rotate HL right (undocumented)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x10
      size: 8
  dsub:
    # subtract BC from HL results in HL (undocumented)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x08
      size: 8
  rdel:
    # rotate DE left through Carry (undocumented)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x18
      size: 8
  ldhi:
    # DE = HL + 1 byte argument (undocumented)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x28
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  ldsi:
    # DE = SP + 1 byte argument (undocumented)
    # reads SP but does not move it, so stack depth is unchanged
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x38
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  shlx:
    # Store HL as per DE
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xD9
        size: 8
  lhlx:
    # load HL as per DE
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xED
        size: 8
  rstv:
    # restart on overflow
    # On overflow CALL 0040
    # flow counters: intentionally unannotated. rstv is a conditional call
    # whose target (0x0040) is a fixed vector, not an operand value, so the
    # analyzer cannot follow it; conditional-terminal semantics are also not
    # expressible yet. Using rstv inside a tracked region fails loudly
    # (missing flow_transfer) rather than being modeled dishonestly.
    bytecode:
      value: 0xCB
      size: 8
  jk:
    # jump if K (X5) - undocumented underflow or overflow indicator
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xFD
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jnk:
    # jump if not K (X5) - undocumented underflow or overflow indicator
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xDD
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode

  # Interupt Control
  rim:
    #
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x20
      size: 8
  sim:
    # Set Interupt Mask
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x30
      size: 8
  di:
    # disable interupts
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xF3
        size: 8
  ei:
    # enable interupts
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xFB
        size: 8

  # Data Transfer
  lxi:
    # load immediate 16-bit
    # Bit format 00xx0001, xx = register pair
    # flow counters: split into variants (identical bytecode) because the
    # stack effect depends on the destination register pair.
    variants:
      # lxi into bc/de/hl: ordinary instruction, stack depth unchanged
      - flow_effects: {stack: 0}
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 1
            size: 4
        operands:
          count: 2
          operand_sets:
            list:
              - register_pairs
              - uint16_no_bytecode
            disallowed_pairs:
              - [sp_pair, uint16]
      # lxi into sp replaces the stack anchor wholesale, which no signed depth
      # delta can express. It therefore makes an active stack counter
      # indeterminate; source may establish the known new empty-stack state
      # immediately afterward with `#resume stack = 0`.
      - flow_invalidates: [stack]
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 1
            size: 4
        operands:
          count: 2
          specific_operands:
            sp_immediate:
              list:
                stack_pointer:
                  type: register
                  register: sp
                  bytecode:
                    value: 3
                    size: 2
                immediate_16:
                  type: numeric
                  argument:
                    size: 16
                    word_align: true
                    endian: little
  stax:
    # store A contents direct to memory address in register pair
    # Bit format 00xx0010, xx = register pair BC or DE
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0
      size: 2
      suffix:
        value: 2
        size: 4
    operands:
      count: 1
      operand_sets:
        list:
          - register_pairs_bc_de_only
  ldax:
    # load A direct from memory address in register pair
    # Bit format 00xx0010, xx = register pair BC or DE
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0
      size: 2
      suffix:
        value: 10
        size: 4
    operands:
      count: 1
      operand_sets:
        list:
          - register_pairs_bc_de_only
  shld:
    # store HL direct
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x22
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  lhld:
    # load HL direct
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x2A
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  sta:
    # store A direct
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x32
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  lda:
    # load A direct
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x3A
      size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  mvi:
    # move immediate
    # Bit format 00xxx110, xxx = register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0
      size: 2
      suffix:
        value: 6
        size: 3
    operands:
      count: 2
      operand_sets:
        list:
          - 8_bit_source
          - uint8_no_bytecode
  mov:
    # move value from register to register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 1
        size: 2
    operands:
      count: 2
      operand_sets:
        list:
          - 8_bit_source
          - 8_bit_source
        disallowed_pairs:
          - [m_reg,m_reg]
          - [m_reg_actual,m_reg]
          - [m_reg,m_reg_actual]
          - [m_reg_actual,m_reg_actual]
  xthl:
    # exchange contentents of HL with memory pointed to by SP (stack pointer)
    # flow counters: exchanges the top-of-stack CONTENT with HL; SP does not
    # move, so tracked stack depth is unchanged
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xE3
        size: 8
  xchg:
    # exchange HL with DE
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xEB
        size: 8

  # Arithmetic and Logic
  add:
    # add source value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 16
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  adc:
    # add source value and carry flag to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 17
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  adi:
    # add immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xC6
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  aci:
    # add with carry immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xCE
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  sub:
    # subtract source value from A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 18
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  sbb:
    # subtract with borrow source value from A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 19
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  sui:
    # subtract immediate value from A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xD6
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  sbi:
    # subtract with borrow immediate value from A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xDE
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  inx:
    # increment register pair
    # Bit format 00xx0011, xx = register pair
    # flow counters: split into variants (identical bytecode) because the
    # stack effect depends on the register pair.
    variants:
      # inx bc/de/hl: ordinary instruction, stack depth unchanged
      - flow_effects: {stack: 0}
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 3
            size: 4
        operands:
          count: 1
          operand_sets:
            list:
              - register_pairs
            disallowed_pairs:
              - [sp_pair]
      # inx sp: SP moves up by one byte, so the stack becomes one byte
      # SHALLOWER — the depth counter moves inversely to the stack pointer
      # on this descending stack
      - flow_effects: {stack: -1}
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 3
            size: 4
        operands:
          count: 1
          specific_operands:
            inx_sp:
              list:
                stack_pointer:
                  type: register
                  register: sp
                  bytecode:
                    value: 3
                    size: 2
  dcx:
    # decrement register pair
    # Bit format 00xx1011, xx = register pair
    # flow counters: split into variants (identical bytecode) because the
    # stack effect depends on the register pair.
    variants:
      # dcx bc/de/hl: ordinary instruction, stack depth unchanged
      - flow_effects: {stack: 0}
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 11
            size: 4
        operands:
          count: 1
          operand_sets:
            list:
              - register_pairs
            disallowed_pairs:
              - [sp_pair]
      # dcx sp: SP moves down by one byte, so the stack becomes one byte
      # DEEPER — the depth counter moves inversely to the stack pointer on
      # this descending stack
      - flow_effects: {stack: 1}
        flow_transfer: none
        bytecode:
          value: 0
          size: 2
          suffix:
            value: 11
            size: 4
        operands:
          count: 1
          specific_operands:
            dcx_sp:
              list:
                stack_pointer:
                  type: register
                  register: sp
                  bytecode:
                    value: 3
                    size: 2
  inr:
    # increment register
    # Bit format 00xxx100, xxx = register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0
        size: 2
        suffix:
          value: 4
          size: 3
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  dcr:
    # decrement register
    # Bit format 00xxx101, xxx = register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0
        size: 2
        suffix:
          value: 5
          size: 3
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  cma:
    # product 1's complement of A in A
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x2F
      size: 8
  rlc:
    # rotate A left (B7 to B0 and Carry)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x07
      size: 8
  rrc:
    # rotate A right (B0 to B7 and Carry)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x0F
      size: 8
  ral:
    # rotate A left through carry (B7 to Carry, Carry to B0)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x17
      size: 8
  rar:
    # rotate A right through carry (B0 to Carry, Carry to B7)
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x1F
      size: 8
  daa:
    # adjust A to binary coded decimal
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
      value: 0x27
      size: 8
  dad:
    # add contents of register pair to HL
    # Bit format 00xx1001, xx = register pair
    # flow counters: `dad sp` READS the stack pointer into the HL sum but does
    # not move it, so every dad variant leaves stack depth unchanged and the
    # effect can live uniformly at the instruction level
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0
        size: 2
        suffix:
          value: 9
          size: 4
    operands:
      count: 1
      operand_sets:
        list:
          - register_pairs
  ana:
    # AND source value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 20
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  ani:
    # AND immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xE6
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  xra:
    # XOR source value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 21
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  xri:
    # XOR immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xEE
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  ora:
    # OR source value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 22
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  ori:
    # OR immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xF6
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode
  cmp:
    # Compare source value to A register
    # Zero flag indictes equality
    # Carry flag indicates source value us greater than A
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 23
        size: 5
    operands:
      count: 1
      operand_sets:
        list:
          - 8_bit_source
  cpi:
    # Compare immediate value to A register
    flow_effects: {stack: 0}
    flow_transfer: none
    bytecode:
        value: 0xFE
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint8_no_bytecode

  # Program Flow Control
  jmp:
    # unconditional jump
    flow_effects: {stack: 0}
    flow_transfer: unconditional
    flow_target_operand: 0
    bytecode:
        value: 0xC3
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jz:
    # jump if zero flag is set
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xCA
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jnz:
    # jump if zero flag not set
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xC2
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jc:
    # jump if carry flag is set
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xDA
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jnc:
    # jump if carry flag not set
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xD2
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jpe:
    # jump if parity is even (parity flag is one)
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xEA
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jpo:
    # jump if parity is odd (parity flag is zero)
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xE2
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jm:
    # jump if accumultor is minus (sign flag is one)
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xFA
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  jp:
    # jump if accumultor is positive (sign flag is zero)
    flow_effects: {stack: 0}
    flow_transfer: conditional
    flow_target_operand: 0
    bytecode:
        value: 0xF2
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  pchl:
    # Move HL to Program Counter (Jump to address in HL)
    # flow counters: a computed jump — the target is unknowable at assembly
    # time, so this is classified `indirect` and is rejected inside an active
    # tracking region (close the region with #endtrack first)
    flow_effects: {stack: 0}
    flow_transfer: indirect
    bytecode:
        value: 0xE9
        size: 8

  # Stack Operations
  ret:
    # return unconditionally
    # flow counters: the physical -2 delta is the return-address pop, which is
    # caller-owned control-flow state. `before_effect` therefore checks that
    # routine-owned stack movement is reconciled to the exit contract BEFORE
    # the pop, then ends the execution path.
    flow_effects: {stack: -2}
    flow_terminal:
      stack: before_effect
    flow_transfer: return
    bytecode:
        value: 0xC9
        size: 8
  # flow counters: the conditional returns (rz/rnz/rc/rnc/rpe/rpo/rm/rp) are
  # intentionally UNANNOTATED. A conditional return is a conditional path
  # terminal, which the analysis model cannot yet express (terminals arrive
  # with a later milestone only in unconditional form). Using one inside a
  # tracked region fails loudly rather than being modeled dishonestly; use an
  # unconditional `ret` (e.g. behind a conditional jump) in tracked regions.
  rz:
    # return if zero flag is set
    bytecode:
        value: 0xC8
        size: 8
  rnz:
    # return if zero flag not set
    bytecode:
        value: 0xC0
        size: 8
  rc:
    # return if carry flag is set
    bytecode:
        value: 0xD8
        size: 8
  rnc:
    # return if carry flag not set
    bytecode:
        value: 0xD0
        size: 8
  rpe:
    # return if parity is even (parity flag is one)
    bytecode:
        value: 0xE8
        size: 8
  rpo:
    # return if parity is odd (parity flag is zero)
    bytecode:
        value: 0xE0
        size: 8
  rm:
    # return if accumultor is negative (sign flag is one)
    bytecode:
        value: 0xF8
        size: 8
  rp:
    # return if accumultor is positive (sign flag is zero)
    bytecode:
        value: 0xF0
        size: 8
  call:
    # Call unconditionally
    # flow counters: flow_effects carries the physical +2 return-address push
    # (the callee-entry truth); flow_call_effects declares the caller-visible
    # net effect of a conventional callee — the stack returns to its pre-call
    # depth at the fall-through.
    flow_effects: {stack: 2}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xCD
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  # Conditional calls physically push the 2-byte return address only on the
  # taken edge. Their caller-visible summary is nevertheless net zero on both
  # outcomes because a conventional taken callee returns through `ret`.
  cz:
    # Call if zero
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xCC
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cnz:
    # Call if not zero
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xC4
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cc:
    # Call if carry
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xDC
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cnc:
    # Call if not carry
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xD4
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cpe:
    # Call if parity even (panty flag is set to one)
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xEC
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cpo:
    # Call if parity odd (panty flag is set to zero)
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xE4
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cm:
    # Call if accumulator is minus (sign flag is one)
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xFC
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  cp:
    # Call if accumulator is positive (sign flag is zero)
    flow_effects: {stack: {taken: 2, fall_through: 0}}
    flow_transfer: call
    flow_target_operand: 0
    flow_call_effects: {stack: 0}
    bytecode:
        value: 0xF4
        size: 8
    operands:
      count: 1
      operand_sets:
        list:
          - uint16_no_bytecode
  rst:
    # flow counters: intentionally UNANNOTATED. The operand is the vector
    # index N, but execution transfers to address N*8 — the target is not the
    # operand's value, and flow_target_operand cannot express that scaling
    # until richer transfer metadata exists. Using rst inside a tracked region
    # fails loudly (missing flow metadata) rather than following a wrong
    # target.
    bytecode:
      value: 3
      size: 2
      suffix:
        value: 7
        size: 3
    operands:
      count: 1
      specific_operands:
        reset_index:
          list:
            address_code:
              type: numeric_bytecode
              bytecode:
                size: 3
                max: 7
                min: 0
                word_align: false
  push:
    # flow counters: every push variant (register pair or psw) stores two
    # bytes, so the +2 depth effect lives uniformly at the instruction level
    # and is inherited by both variants
    flow_effects: {stack: 2}
    flow_transfer: none
    variants:
      # Push a register pair to the stack
      # Bit format 11xx0101, xx = register pair
      - bytecode:
          value: 3
          size: 2
          suffix:
            value: 5
            size: 4
        operands:
          count: 1
          operand_sets:
            list:
              - register_pairs
            disallowed_pairs:
              - [sp_pair]
      # Push the Program Status Words (A + flags)
      - bytecode:
          value: 0xF5
          size: 8
        operands:
          count: 1
          specific_operands:
            psw_register:
              list:
                program_status_word:
                  type: register
                  register: psw
  sphl:
    # Move HL to SP
    # The stack pointer is replaced wholesale from HL, which no signed depth
    # delta can express. Make an active stack counter indeterminate; if source
    # knows the resulting depth, it may explicitly re-anchor with #resume.
    flow_invalidates: [stack]
    flow_transfer: none
    bytecode:
        value: 0xF9
        size: 8
  pop:
    # flow counters: every pop variant (register pair or psw) removes two
    # bytes, so the -2 depth effect lives uniformly at the instruction level
    # and is inherited by both variants
    flow_effects: {stack: -2}
    flow_transfer: none
    variants:
      # Pop to a register pair except stack pointer SP
      # Bit format 00xx1011, xx = register pair
      - bytecode:
          value: 3
          size: 2
          suffix:
            value: 1
            size: 4
        operands:
          count: 1
          operand_sets:
            list:
              - register_pairs
            disallowed_pairs:
              - [sp_pair]
      # Pop to Program Status Words (A + flags)
      - bytecode:
          value: 0xF1
          size: 8
        operands:
          count: 1
          specific_operands:
            register_psw:
              list:
                program_status_word:
                  type: register
                  register: psw
